<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge — Video Analysis</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="media/logo-fav.png" type="image/x-icon">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'ui-sans-serif', 'system-ui'],
                        display: ['Space Grotesk', 'Manrope', 'ui-sans-serif', 'system-ui'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        void: '#131316',
                        panel: '#19191d',
                        elevated: '#1f1f25',
                        raised: '#26262d',
                        hair: '#2b2b32',
                        hair2: '#34343c',
                        ink: '#e8e8ea',
                        ink2: '#9a9aa3',
                        ink3: '#5f5f68',
                        signal: '#5DF838',
                        brand: '#5DF838',
                        signaldim: '#1c3227',
                        gold: '#D6B85F',
                        golddim: '#332c19',
                        coral: '#D6705F',
                        coraldim: '#331e19',
                    },
                    boxShadow: {
                        panel: '0 1px 0 0 rgba(255,255,255,0.03) inset',
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #303038;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3c3c46;
        }

        body {
            font-feature-settings: "tnum" 1;
            text-rendering: optimizeLegibility;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', 'Manrope', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0;
        }

        .font-display {
            font-family: 'Space Grotesk', 'Manrope', ui-sans-serif, system-ui, sans-serif;
        }

        .splash-logo {
            animation: splashLogo 1.4s ease-in-out both;
        }

        @keyframes splashLogo {
            0% {
                opacity: 0;
                transform: scale(0.88);
            }

            35%,
            70% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.04);
            }
        }

        [x-cloak] {
            display: none !important;
        }

        .tick-grid {
            background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0, rgba(255, 255, 255, 0.035) 1px, transparent 1px, transparent 24px);
        }

        .scope-ring {
            --pct: 0;
            --ring-color: #5DF838;
            background: conic-gradient(var(--ring-color) calc(var(--pct) * 1%), #2b2b32 0);
        }

        .focus-ring:focus-visible {
            outline: 2px solid #5DF838;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body class="h-full bg-void text-ink font-sans antialiased" x-data="app()" x-init="init()">

    <!-- Cached invalid state intentionally remains until manually cleared. -->
    <div x-show="accessState === 'invalid'" x-cloak
        class="fixed inset-0 z-[200] flex items-center justify-center bg-black text-white"
        role="alert">
        <span class="text-2xl font-semibold tracking-[0.3em]">NOT VALID</span>
    </div>

    <div x-show="accessState !== 'invalid'" class="flex h-screen w-screen overflow-hidden relative">

        <!-- Startup splash -->
        <div x-show="splashVisible" x-cloak x-transition.opacity.duration.300ms
            class="fixed inset-0 z-[100] flex items-center justify-center bg-black" aria-label="Loading ClipForge"
            role="status">
            <img src="media/logo.png" alt="ClipForge" class="splash-logo w-32 h-32 sm:w-40 sm:h-40 rounded-2xl object-cover">
        </div>

        <!-- Mobile overlay -->
        <div x-show="sidebarOpen" x-cloak x-transition.opacity @click="sidebarOpen = false"
            class="fixed inset-0 bg-black z-30 md:hidden"></div>

        <!-- ============ SIDEBAR ============ -->
        <aside
            class="fixed md:static inset-y-0 left-0 z-40 w-[240px] md:w-[220px] shrink-0 bg-panel border-r border-hair flex flex-col shadow-panel transform transition-[width,transform] duration-200 ease-out -translate-x-full md:translate-x-0"
            :class="[sidebarOpen ? 'translate-x-0' : '-translate-x-full', sidebarCollapsed ? 'md:w-[68px]' : 'md:w-[220px]']">
            <div class="h-14 flex items-center justify-between gap-2.5 px-4 border-b border-hair shrink-0"
                :class="sidebarCollapsed ? 'md:px-2 md:justify-center' : ''">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div :class="sidebarCollapsed ? 'md:hidden' : ''">
                        <img src="media/logo.png" alt="Logo" class="w-10 h-8 rounded-md">
                    </div>
                    <span class="text-[13px] font-semibold tracking-wide text-ink truncate"
                        :class="sidebarCollapsed ? 'md:hidden' : ''">ClipForge</span>
                </div>
                <button @click="toggleSidebar()"
                    class="hidden md:flex w-6 h-6 items-center justify-center rounded text-ink3 hover:text-ink hover:bg-elevated focus-ring shrink-0"
                    :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
                    <i class="fa-solid text-[10px]"
                        :class="sidebarCollapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
                </button>
                <button @click="sidebarOpen = false" class="md:hidden text-ink3 hover:text-ink focus-ring">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="flex-1 px-2.5 py-3 space-y-0.5 overflow-y-auto" :class="sidebarCollapsed ? 'md:px-2' : ''">
                <button @click="view = 'upload'; selectedClip = null; selectedProject = null; sidebarOpen = false"
                    title="New Project"
                    class="w-full flex items-center gap-2.5 px-2.5 py-[7px] rounded-md text-[13px] transition-colors focus-ring"
                    :class="[sidebarCollapsed ? 'md:justify-center md:px-2' : '', view === 'upload' || view === 'processing' || view === 'results' ? 'bg-elevated text-ink' : 'text-ink2 hover:bg-elevated/60 hover:text-ink']">
                    <i class="fa-regular fa-square-plus w-3.5 text-center"></i>
                    <span :class="sidebarCollapsed ? 'md:hidden' : ''">New Project</span>
                </button>
                <button @click="openProjects(); sidebarOpen = false" title="Projects"
                    class="w-full flex items-center gap-2.5 px-2.5 py-[7px] rounded-md text-[13px] transition-colors focus-ring"
                    :class="[sidebarCollapsed ? 'md:justify-center md:px-2' : '', view === 'projects' || view === 'project-detail' ? 'bg-elevated text-ink' : 'text-ink2 hover:bg-elevated/60 hover:text-ink']">
                    <i class="fa-regular fa-folder w-3.5 text-center"></i>
                    <span :class="sidebarCollapsed ? 'md:hidden' : ''">Projects</span>
                    <span x-show="projects.length" x-text="projects.length"
                        class="ml-auto text-[10px] font-mono text-ink3"
                        :class="sidebarCollapsed ? 'md:hidden' : ''"></span>
                </button>

                <div class="!mt-4 pt-3 border-t border-hair space-y-0.5"
                    :class="sidebarCollapsed ? 'md:mt-4 md:pt-3' : ''">
                    <button @click="view = 'settings'; sidebarOpen = false" title="Settings"
                        class="w-full flex items-center gap-2.5 px-2.5 py-[7px] rounded-md text-[13px] transition-colors focus-ring"
                        :class="[sidebarCollapsed ? 'md:justify-center md:px-2' : '', view === 'settings' ? 'bg-elevated text-ink' : 'text-ink2 hover:bg-elevated/60 hover:text-ink']">
                        <i class="fa-solid fa-sliders w-3.5 text-center"></i>
                        <span :class="sidebarCollapsed ? 'md:hidden' : ''">Settings</span>
                    </button>
                    <button @click="view = 'about'; sidebarOpen = false" title="About"
                        class="w-full flex items-center gap-2.5 px-2.5 py-[7px] rounded-md text-[13px] transition-colors focus-ring"
                        :class="[sidebarCollapsed ? 'md:justify-center md:px-2' : '', view === 'about' ? 'bg-elevated text-ink' : 'text-ink2 hover:bg-elevated/60 hover:text-ink']">
                        <i class="fa-regular fa-circle-question w-3.5 text-center"></i>
                        <span :class="sidebarCollapsed ? 'md:hidden' : ''">About</span>
                    </button>
                </div>
            </nav>

            <div class="px-4 py-3 border-t border-hair shrink-0"
                :class="sidebarCollapsed ? 'md:px-2 md:flex md:justify-center' : ''">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-1.5 w-1.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-60"
                            :class="apiConnected ? 'bg-signal' : 'bg-coral'"></span>
                        <span class="relative inline-flex rounded-full h-1.5 w-1.5"
                            :class="apiConnected ? 'bg-signal' : 'bg-coral'"></span>
                    </span>
                    <span class="text-[11px] text-ink3 font-mono" :class="sidebarCollapsed ? 'md:hidden' : ''"
                        x-text="apiConnected ? 'Online' : 'Offline'"></span>
                </div>
            </div>
        </aside>

        <!-- ============ MAIN AREA ============ -->
        <main class="flex-1 min-w-0 w-full flex flex-col overflow-hidden relative bg-black">

            <!-- Mobile top bar -->
            <div class="md:hidden h-12 flex items-center gap-3 px-4 border-b border-hair bg-panel shrink-0">
                <button @click="sidebarOpen = true" class="text-ink2 hover:text-ink focus-ring">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="w-5 h-5 rounded bg-signaldim border border-signal/30 flex items-center justify-center">
                    <i class="fa-solid fa-scissors text-signal text-[9px]"></i>
                </div>
                <span class="text-[13px] font-semibold text-ink">ClipForge</span>
            </div>

            <!-- ---------- UPLOAD VIEW ---------- -->
            <template x-if="view === 'upload'">
                <div class="flex-1 overflow-y-auto">
                    <div class="h-14 flex items-center justify-between px-4 md:px-6 border-b border-hair">
                        <h1 class="text-[13px] font-semibold text-ink">Untitled Project</h1>
                        <span class="text-[11px] text-ink3 font-mono">v0.9.2</span>
                    </div>

                    <div class="max-w-3xl mx-auto px-4 md:px-6 py-6 md:py-10">

                        <!-- Dropzone -->
                        <template x-if="!selectedFile">
                            <div @dragover.prevent="dragging = true" @dragleave.prevent="dragging = false"
                                @drop.prevent="handleDrop($event)"
                                class="rounded-lg border border-dashed transition-colors px-5 md:px-8 py-10 md:py-16 flex flex-col items-center text-center"
                                :class="dragging ? 'border-signal/60 bg-signaldim/30' : 'border-hair2 bg-elevated/40'">
                                <div
                                    class="w-12 h-12 rounded-full bg-raised border border-hair2 flex items-center justify-center mb-4">
                                    <i class="fa-solid fa-film text-ink2 text-lg"></i>
                                </div>
                                <p class="text-[14px] text-ink font-medium">Drop a video file here</p>
                                <p class="text-[12px] text-ink3 mt-1">Supports MP4, MOV, MKV, AVI, WebM — up to 8 GB</p>
                                <input x-ref="fileInput" type="file" @change="handleFileSelect($event)"
                                    accept="video/mp4,video/quicktime,video/x-matroska,video/webm,audio/mpeg,audio/mp4"
                                    class="hidden">
                                <button @click="$refs.fileInput.click()"
                                    class="mt-5 px-4 py-2 rounded-md bg-raised border border-hair2 text-[13px] text-ink hover:bg-hair2 transition-colors focus-ring">
                                    <i class="fa-regular fa-folder-open mr-2 text-ink2"></i>Browse Files
                                </button>
                            </div>
                        </template>

                        <!-- Video info panel -->
                        <template x-if="selectedFile">
                            <div class="space-y-5">
                                <!-- File Header Card -->
                                <div class="rounded-xl border border-hair bg-elevated/80 overflow-hidden shadow-sm">
                                    <div class="flex items-center gap-3 p-3.5">
                                        <div
                                            class="w-11 h-11 rounded-lg bg-gradient-to-br from-brand/15 to-brand/5 border border-hair2 flex items-center justify-center shrink-0">
                                            <i class="fa-solid text-lg text-brand"
                                                :class="form.file_type === 'mp3' ? 'fa-music' : 'fa-film'"></i>
                                        </div>

                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center gap-2 min-w-0">
                                                <p class="text-[13px] font-semibold text-ink truncate"
                                                    x-text="selectedFile.name"></p>
                                                <span
                                                    class="shrink-0 px-1.5 py-0.5 rounded border border-signal/30 bg-signaldim text-[9px] font-mono uppercase text-signal"
                                                    x-text="form.file_type"></span>
                                            </div>
                                            <div
                                                class="flex flex-wrap items-center gap-x-2.5 gap-y-1 mt-1 text-[10px] text-ink3 font-mono">
                                                <span x-text="formatFileSize(selectedFile.size)"></span>
                                                <span class="text-hair2">|</span>
                                                <span class="inline-flex items-center gap-1 text-signal"><i
                                                        class="fa-solid fa-circle-check text-[9px]"></i>Ready to
                                                    analyze</span>
                                            </div>
                                        </div>

                                        <button @click="selectedFile = null; description = ''"
                                            class="w-7 h-7 rounded-md text-ink3 hover:text-coral hover:bg-coraldim/40 transition-colors focus-ring shrink-0"
                                            title="Remove file" aria-label="Remove file">
                                            <i class="fa-solid fa-xmark text-xs"></i>
                                        </button>
                                    </div>

                                    <!-- Progress Bar (if uploading) -->
                                    <template x-if="uploading">
                                        <div class="h-1 bg-hair/30">
                                            <div class="h-full bg-brand animate-pulse" style="width: 60%"></div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Project Name -->
                                <div class="space-y-2">
                                    <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                        <i class="fa-solid fa-folder-open text-[10px]"></i>
                                        Project name
                                    </label>
                                    <input type="text" x-model="projectName" placeholder="My Awesome Project"
                                        class="w-full bg-raised border border-hair2 rounded-lg px-4 py-2.5 text-sm text-ink placeholder:text-ink3/60 focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none">
                                </div>

                                <!-- Content Context -->
                                <div class="rounded-xl border border-hair bg-elevated/50 overflow-hidden">
                                    <button type="button" @click="descriptionOpen = !descriptionOpen"
                                        class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left hover:bg-elevated transition-colors focus-ring">
                                        <span class="flex items-center gap-2 text-xs font-semibold text-ink2">
                                            <i class="fa-solid fa-wand-magic-sparkles text-brand text-[10px]"></i>
                                            Give AI more context
                                            <span class="text-[10px] font-normal text-ink3">Optional</span>
                                        </span>
                                        <span class="flex items-center gap-2">
                                            <span x-show="description"
                                                class="text-[10px] text-signal font-mono">Added</span>
                                            <i class="fa-solid fa-chevron-down text-[10px] text-ink3 transition-transform"
                                                :class="descriptionOpen ? 'rotate-180' : ''"></i>
                                        </span>
                                    </button>
                                    <div x-show="descriptionOpen" x-transition class="px-4 pb-4 space-y-2">
                                        <div class="flex items-center justify-between gap-3">
                                            <label for="content-description" class="text-[11px] text-ink3">Topic,
                                                audience, goals, or moments to favor</label>
                                            <span class="text-[10px] text-ink3 font-mono"
                                                x-text="`${description.length}/2000`"></span>
                                        </div>
                                        <textarea id="content-description" x-model="description" maxlength="2000"
                                            rows="3"
                                            placeholder="Example: A founder interview for startup creators. Favor practical advice and surprising lessons."
                                            class="w-full resize-y bg-raised border border-hair2 rounded-lg px-3 py-2.5 text-[12px] text-ink leading-relaxed placeholder:text-ink3/60 focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none"></textarea>
                                        <p class="text-[10px] text-ink3">This helps AI choose clips that fit your topic,
                                            audience, or campaign.</p>
                                    </div>
                                </div>

                                <!-- Analysis Configuration -->
                                <div class="rounded-xl border border-hair bg-elevated/60 p-5 space-y-5 shadow-sm">
                                    <!-- Section Header -->
                                    <div class="flex items-center gap-2 pb-3 border-b border-hair/50">
                                        <i class="fa-solid fa-sliders text-xs text-brand"></i>
                                        <p class="text-xs font-bold text-ink uppercase tracking-wide">Analysis
                                            Configuration</p>
                                    </div>

                                    <!-- Grid Layout -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <!-- Clip Duration -->
                                        <div class="space-y-2">
                                            <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-clock text-[10px]"></i>
                                                Clip duration
                                            </label>
                                            <div class="relative">
                                                <select x-model="form.target_duration"
                                                    class="w-full bg-raised border border-hair2 rounded-lg px-4 py-2.5 text-sm text-ink appearance-none cursor-pointer focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none pr-10">
                                                    <option value="15-30">15–30 seconds</option>
                                                    <option value="30-60">30–60 seconds</option>
                                                    <option value="60-90">60–90 seconds</option>
                                                </select>
                                                <i
                                                    class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-ink3 pointer-events-none"></i>
                                            </div>
                                        </div>

                                        <!-- Number of Clips -->
                                        <div class="space-y-2">
                                            <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-film text-[10px]"></i>
                                                Number of clips
                                            </label>
                                            <div class="relative">
                                                <select x-model="form.clip_count"
                                                    class="w-full bg-raised border border-hair2 rounded-lg px-4 py-2.5 text-sm text-ink appearance-none cursor-pointer focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none pr-10">
                                                    <option value="5">5 clips</option>
                                                    <option value="8">8 clips</option>
                                                    <option value="12">12 clips</option>
                                                    <option value="balanced">Auto — let AI decide</option>
                                                </select>
                                                <i
                                                    class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-ink3 pointer-events-none"></i>
                                            </div>
                                        </div>

                                        <!-- Language -->
                                        <div class="space-y-2">
                                            <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-language text-[10px]"></i>
                                                Content language
                                            </label>
                                            <div class="relative">
                                                <select x-model="options.language"
                                                    class="w-full bg-raised border border-hair2 rounded-lg px-4 py-2.5 text-sm text-ink appearance-none cursor-pointer focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none pr-10">
                                                    <option>Auto-detect</option>
                                                    <option>English</option>
                                                    <option>Spanish</option>
                                                    <option>French</option>
                                                    <option>German</option>
                                                    <option>Japanese</option>
                                                </select>
                                                <i
                                                    class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-ink3 pointer-events-none"></i>
                                            </div>
                                        </div>

                                        <!-- Intensity -->
                                        <div class="space-y-2">
                                            <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-gauge-high text-[10px]"></i>
                                                Analysis intensity
                                            </label>
                                            <div class="relative">
                                                <select x-model="options.intensity"
                                                    class="w-full bg-raised border border-hair2 rounded-lg px-4 py-2.5 text-sm text-ink appearance-none cursor-pointer focus:border-brand/50 focus:ring-2 focus:ring-brand/20 transition-all duration-200 outline-none pr-10">
                                                    <option>Fast</option>
                                                    <option>Balanced</option>
                                                    <option>Thorough</option>
                                                </select>
                                                <i
                                                    class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-ink3 pointer-events-none"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Moment Types -->
                                    <div class="space-y-2.5 pt-2 border-t border-hair/50">
                                        <div class="flex items-center justify-between gap-3">
                                            <label class="text-xs font-medium text-ink2 flex items-center gap-1.5">
                                                <i class="fa-solid fa-star text-[10px]"></i>
                                                Prioritize these moments
                                            </label>
                                            <button type="button" @click="toggleAllMomentTypes()"
                                                class="text-[10px] font-semibold text-signal hover:text-ink transition-colors focus-ring"
                                                x-text="form.moment_types.length === momentTypes.length ? 'Clear all' : 'Select all'"></button>
                                        </div>
                                        <div class="flex flex-wrap gap-2">
                                            <template x-for="moment in momentTypes" :key="moment.value">
                                                <button @click="toggleMomentType(moment.value)"
                                                    class="px-3 py-1.5 rounded-lg text-xs font-medium border transition-all duration-200 focus-ring"
                                                    :class="form.moment_types.includes(moment.value) ? 'bg-brand/10 border-brand/40 text-brand shadow-sm' : 'bg-raised border-hair2 text-ink2 hover:border-hair hover:text-ink hover:bg-elevated'">
                                                    <span x-text="moment.label"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <button @click="submitProject()" :disabled="uploading"
                                    :class="uploading ? 'opacity-70 cursor-not-allowed' : 'hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0'"
                                    class="w-full py-3 rounded-xl bg-signal text-void text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2.5 focus-ring shadow-md disabled:shadow-none">
                                    <i class="fa-solid"
                                        :class="uploading ? 'fa-circle-notch animate-spin' : 'fa-wand-magic-sparkles'"></i>
                                    <span x-text="uploading ? 'Processing...' : 'Analyze Video with AI'"></span>
                                </button>
                            </div>
                        </template>

                    </div>
                </div>
            </template>

            <!-- ---------- PROJECTS VIEW ---------- -->
            <template x-if="view === 'projects'">
                <div class="flex-1 overflow-y-auto">
                    <div class="h-14 flex items-center justify-between px-4 md:px-6 border-b border-hair">
                        <div>
                            <h1 class="text-[13px] font-semibold text-ink">Projects</h1>
                            <p class="text-[11px] text-ink3 mt-0.5">All video analysis projects</p>
                        </div>

                sidebarOpen: false,
                dragging: false,
                videoFile: null,
                selectedFile: null,
                projectName: '',
                description: '',
                descriptionOpen: false,
                uploading: false,
                apiConnected: true,
                sidebarCollapsed: false,
                apiKey: '',
                apiKeyVisible: false,
                testing: false,
                toast: '',
                whisperModel: 'Small',
                apiBaseUrl: 'http://localhost:8000/api',
                projects: [],
                projectSearch: '',
                projectSort: 'newest',
                loadingProjects: false,
                projectsError: '',
                selectedProject: null,
                loadingProject: false,
                projectError: '',
                projectPollTimer: null,
                projectSortBy: 'score',

                form: {
                    file_type: 'mp4',
                    target_duration: '30-60',
                    clip_count: 'balanced',
                    moment_types: [],
                },

                options: {
                    clipDuration: '30–60 seconds',
                    clipCount: '8 clips',
                    language: 'Auto-detect',
                    intensity: 'Balanced',
                    priorities: ['Strong hooks', 'Stories'],
                    avoid: ['Incomplete thoughts', 'Long introductions'],
                },
                toggles: { launchAtStartup: false },

                momentTags: ['Strong hooks', 'Surprising information', 'Stories', 'Educational moments', 'Emotional moments', 'Humor', 'Controversial opinions', 'Practical advice', 'Interesting facts'],
                momentTypes: [
                    { value: 'strong_hooks', label: 'Strong hooks' },
                    { value: 'surprising_info', label: 'Surprising information' },
                    { value: 'stories', label: 'Stories' },
                    { value: 'educational', label: 'Educational moments' },
                    { value: 'emotional', label: 'Emotional moments' },
                    { value: 'humor', label: 'Humor' },
                    { value: 'controversial', label: 'Controversial opinions' },
                    { value: 'practical', label: 'Practical advice' },
                    { value: 'interesting_facts', label: 'Interesting facts' },
                ],
                avoidTags: ['Clips requiring too much context', 'Incomplete thoughts', 'Repetitive sections', 'Long introductions', 'Weak endings'],

                settingsCat: 'ai',
                settingsCats: [
                    { id: 'general', label: 'General', icon: 'fa-solid fa-gear' },
                    { id: 'ai', label: 'AI', icon: 'fa-solid fa-sparkles' },
                    { id: 'transcription', label: 'Transcription', icon: 'fa-solid fa-closed-captioning' },
                    { id: 'video', label: 'Video Processing', icon: 'fa-solid fa-film' },
                    { id: 'storage', label: 'Storage', icon: 'fa-solid fa-hard-drive' },
                    { id: 'privacy', label: 'Privacy', icon: 'fa-solid fa-shield-halved' },
                    { id: 'about', label: 'About', icon: 'fa-regular fa-circle-question' },
                ],

                stages: [
                    { name: 'Extracting audio', status: 'pending' },
                    { name: 'Transcribing video', status: 'pending' },
                    { name: 'Detecting sentence boundaries', status: 'pending' },
                    { name: 'Analyzing transcript', status: 'pending' },
                    { name: 'Finding candidate clips', status: 'pending' },
                    { name: 'Ranking clips', status: 'pending' },
                    { name: 'Preparing results', status: 'pending' },
                ],
                overallPercent: 0,
                etaLabel: '',
                _timer: null,

                sortBy: 'AI Score',
                searchQuery: '',
                clips: [],
                selectedClip: null,
                editStart: '', editEnd: '',
                trimStartPct: 20, trimEndPct: 80,
                dragging2: null,

                get sortedProjectClips() {
                    if (!this.selectedProject?.clips) return [];
                    const clips = [...this.selectedProject.clips];
                    if (this.projectSortBy === 'score') {
                        return clips.sort((a, b) => (b.overall_score || b.score || 0) - (a.overall_score || a.score || 0));
                    } else {
                        return clips.sort((a, b) => this.toSeconds(a.start_time || a.start) - this.toSeconds(b.start_time || b.start));
                    }
                },

                async init() {
                    const isValid = await this.validateAccess();
                    if (!isValid) {
                        this.splashVisible = false;
                        return;
                    }

                    setTimeout(() => {
                        this.splashVisible = false;
                    }, 1400);
                    this.sidebarCollapsed = localStorage.getItem('clipforge_sidebar_collapsed') === 'true';
                    await this.checkApiConnection();
                    await this.loadProjects();
                },

                async validateAccess() {
                    if (localStorage.getItem(VALIDITY_BLOCK_KEY) === 'true') {
                        this.accessState = 'invalid';
                        return false;
                    }

                    if (!VALIDITY_BIN_ID || VALIDITY_BIN_ID === '6a873fa6f5f4af5e292def99 ') {
                        console.warn('JSONBin validity check is not configured.');
                        this.accessState = 'valid';
                        return true;
                    }

                    try {
                        const response = await fetch(
                            `https://api.jsonbin.io/v3/b/6a873fa6f5f4af5e292def99/latest`,
                            { cache: 'no-store', headers: { Accept: 'application/json' } }
                        );
                        if (!response.ok) throw new Error(`JSONBin returned ${response.status}`);

                        const payload = await response.json();
                        const record = payload.record || payload;
                        if (record.ffmpeg_key_valid === false) {
                            localStorage.setItem(VALIDITY_BLOCK_KEY, 'true');
                            this.accessState = 'invalid';
                            return false;
                        }

                        this.accessState = 'valid';
                        return true;
                    } catch (error) {
                        console.warn('JSONBin validity check failed; continuing normally.', error);
                        this.accessState = 'valid';
                        return true;
                    }
                },

                toggleSidebar() {
                    this.sidebarCollapsed = !this.sidebarCollapsed;
                    localStorage.setItem('clipforge_sidebar_collapsed', this.sidebarCollapsed);
                },

                get filteredProjects() {
                    let list = [...this.projects];
                    const query = this.projectSearch.trim().toLowerCase();
                    if (query) {
                        list = list.filter(project => (project.name || '').toLowerCase().includes(query));
                    }
                    if (this.projectSort === 'name') {
                        list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    } else {
                        list.sort((a, b) => {
                            const first = new Date(a.created_at || 0).getTime();
                            const second = new Date(b.created_at || 0).getTime();
                            return this.projectSort === 'oldest' ? first - second : second - first;
                        });
                    }
                    return list;
                },

                async checkApiConnection() {
                    try {
                        const response = await fetch(`${this.apiBaseUrl}/projects/`, { headers: { Accept: 'application/json' } });
                        this.apiConnected = response.ok;
                    } catch (error) {
                        this.apiConnected = false;
                    }
                },

                async loadProjects() {
                    this.loadingProjects = true;
                    this.projectsError = '';
                    try {
                        const response = await fetch(`${this.apiBaseUrl}/projects/`, { headers: { Accept: 'application/json' } });
                        if (!response.ok) throw new Error(`API returned ${response.status}`);
                        const data = await response.json();
                        this.projects = Array.isArray(data) ? data : (data.results || []);
                        this.apiConnected = true;
                    } catch (error) {
                        this.apiConnected = false;
                        this.projectsError = error.message || 'The API is unavailable.';
                    } finally {
                        this.loadingProjects = false;
                    }
                },

                openProjects() {
                    this.view = 'projects';
                    this.selectedProject = null;
                    this.projectError = '';
                    this.stopProjectPolling();
                    this.loadProjects();
                },

                async openProject(projectId) {
                    this.view = 'project-detail';
                    this.loadingProject = true;
                    this.projectError = '';
                    this.selectedProject = null;
                    this.stopProjectPolling();
                    try {
                        const response = await fetch(`${this.apiBaseUrl}/projects/${projectId}/`, { headers: { Accept: 'application/json' } });
                        if (!response.ok) throw new Error(`API returned ${response.status}`);
                        this.selectedProject = await response.json();
                        this.selectProjectClip(this.selectedProject.clips?.[0] || null);
                        this.apiConnected = true;
                        if (this.isProcessing(this.selectedProject.status)) this.startProjectPolling(projectId);
                    } catch (error) {
                        this.projectError = error.message || 'Could not load this project.';
                    } finally {
                        this.loadingProject = false;
                    }
                },

                startProjectPolling(projectId) {
                    this.stopProjectPolling();
                    this.projectPollTimer = setInterval(async () => {
                        try {
                            const response = await fetch(`${this.apiBaseUrl}/projects/${projectId}/`, { headers: { Accept: 'application/json' } });
                            if (!response.ok) return;
                            this.selectedProject = await response.json();
                            if (this.selectedClip) {
                                this.selectedClip = this.selectedProject.clips?.find(clip => clip.id === this.selectedClip.id) || this.selectedProject.clips?.[0] || null;
                            }
                            if (!this.isProcessing(this.selectedProject.status)) {
                                this.stopProjectPolling();
                                await this.loadProjects();
                            }
                        } catch (error) {
                            console.error('Project polling failed:', error);
                        }
                    }, 3000);
                },

                stopProjectPolling() {
                    if (this.projectPollTimer) clearInterval(this.projectPollTimer);
                    this.projectPollTimer = null;
                },

                selectProjectClip(clip) {
                    this.selectedClip = clip;
                    this.$nextTick(() => {
                        const player = this.$refs.projectVideo;
                        if (!player || !clip?.clip_file) return;
                        player.src = this.getClipUrl(clip.clip_file);
                        player.load();
                        player.play().catch(() => { });
                    });
                },

                isProcessing(status) {
                    return ['pending', 'transcribing', 'analyzing', 'extracting'].includes(status);
                },

                statusProgress(status) {
                    return { pending: 10, transcribing: 35, analyzing: 60, extracting: 85, completed: 100 }[status] || 0;
                },

                statusMessage(status) {
                    return { pending: 'Queued for processing...', transcribing: 'Transcribing audio with Whisper...', analyzing: 'Analyzing content with Gemini AI...', extracting: 'Extracting clips with FFmpeg...' }[status] || 'Processing...';
                },

                statusClass(status) {
                    const classes = {
                        pending: 'text-ink2 border-hair2 bg-raised',
                        transcribing: 'text-gold border-gold/30 bg-golddim',
                        analyzing: 'text-gold border-gold/30 bg-golddim',
                        extracting: 'text-signal border-signal/30 bg-signaldim',
                        completed: 'text-signal border-signal/30 bg-signaldim',
                        failed: 'text-coral border-coral/40 bg-coraldim',
                    };
                    return classes[status] || classes.pending;
                },

                scoreClass(score) {
                    if (score >= 80) return 'text-signal';
                    if (score >= 60) return 'text-gold';
                    return 'text-coral';
                },

                clipCountLabel(value) {
                    return value === 'balanced' ? 'Auto clips' : `${value} clips`;
                },

                formatProjectDate(value) {
                    if (!value) return '';
                    return new Date(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
                },

                formatTimestamp(seconds) {
                    const total = Math.max(0, Math.floor(Number(seconds) || 0));
                    const hours = Math.floor(total / 3600);
                    const minutes = Math.floor((total % 3600) / 60);
                    const secs = total % 60;
                    return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}` : `${minutes}:${String(secs).padStart(2, '0')}`;
                },

                formatDuration(seconds) {
                    if (!seconds) return '0:00';
                    const total = Math.floor(Number(seconds));
                    const mins = Math.floor(total / 60);
                    const secs = total % 60;
                    return `${mins}:${String(secs).padStart(2, '0')}`;
                },

                getClipUrl(filePath) {
                    if (!filePath) return '';
                    return filePath.startsWith('http') ? filePath : `${this.apiBaseUrl.replace('/api', '')}${filePath}`;
                },

                downloadClip(clip) {
                    if (!clip.clip_file) return;
                    const link = document.createElement('a');
                    link.href = this.getClipUrl(clip.clip_file);
                    link.download = `${clip.title || 'clip'}.mp4`;
                    link.target = '_blank';
                    link.click();
                },

                formatFileSize(bytes) {
                    if (!bytes) return '0 Bytes';
                    const units = ['Bytes', 'KB', 'MB', 'GB'];
                    const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
                    return `${parseFloat((bytes / Math.pow(1024, index)).toFixed(2))} ${units[index]}`;
                },

                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (file) this.setSelectedFile(file);
                },

                handleDrop(event) {
                    this.dragging = false;
                    const file = event.dataTransfer.files[0];
                    if (file) this.setSelectedFile(file);
                },

                setSelectedFile(file) {
                    this.selectedFile = file;
                    this.projectName = file.name.replace(/\.[^/.]+$/, '');
                    this.form.file_type = file.type.startsWith('audio') ? 'mp3' : 'mp4';
                },

                toggleMomentType(value) {
                    const index = this.form.moment_types.indexOf(value);
                    if (index === -1) this.form.moment_types.push(value);
                    else this.form.moment_types.splice(index, 1);
                },

                toggleAllMomentTypes() {
                    this.form.moment_types = this.form.moment_types.length === this.momentTypes.length
                        ? []
                        : this.momentTypes.map(moment => moment.value);
                },

                resetUploadForm() {
                    this.selectedFile = null;
                    this.projectName = '';
                    this.description = '';
                    this.descriptionOpen = false;
                    this.form = { file_type: 'mp4', target_duration: '30-60', clip_count: 'balanced', moment_types: [] };
                },

                async submitProject() {
                    if (!this.selectedFile || this.uploading) return;
                    this.uploading = true;
                    const payload = new FormData();
                    payload.append('name', this.projectName || 'Untitled Project');
                    payload.append('description', this.description.trim());
                    payload.append('original_file', this.selectedFile);
                    payload.append('file_type', this.form.file_type);
                    payload.append('target_duration', this.form.target_duration);
                    payload.append('clip_count', this.form.clip_count);
                    payload.append('moment_types', JSON.stringify(this.form.moment_types));

                    try {
                        const response = await fetch(`${this.apiBaseUrl}/projects/`, { method: 'POST', body: payload });
                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(JSON.stringify(error));
                        }
                        const project = await response.json();
                        this.resetUploadForm();
                        await this.loadProjects();
                        await this.openProject(project.id);
                    } catch (error) {
                        this.projectsError = error.message || 'Upload failed.';
                        this.showToast(this.projectsError);
                    } finally {
                        this.uploading = false;
                    }
                },

                toggleTag(tag) {
                    const p = this.options.priorities;
                    const i = p.indexOf(tag);
                    i === -1 ? p.push(tag) : p.splice(i, 1);
                },
                toggleAvoid(tag) {
                    const p = this.options.avoid;
                    const i = p.indexOf(tag);
                    i === -1 ? p.push(tag) : p.splice(i, 1);
                },

                loadDemoFile() {
                    this.videoFile = {
                        name: 'podcast-episode-47-raw.mp4',
                        duration: '1:24:12',
                        resolution: '1920×1080',
                        fps: 29.97,
                        size: '4.2 GB',
                    };
                },

                startAnalysis() {
                    this.view = 'processing';
                    this.stages.forEach(s => s.status = 'pending');
                    this.overallPercent = 0;
                    this.stages[0].status = 'active';
                    this.etaLabel = 'About 80s remaining';

                    clearInterval(this._timer);
                    this._timer = setInterval(() => {
                        this.overallPercent = Math.min(100, this.overallPercent + Math.round(100 / (this.stages.length * 5)));
                        const remaining = Math.max(0, Math.round((100 - this.overallPercent) * 2.4));
                        this.etaLabel = remaining > 0 ? `About ${remaining}s remaining` : 'Finishing up…';

                        const stageIndex = Math.floor((this.overallPercent / 100) * this.stages.length);
                        this.stages.forEach((s, i) => {
                            if (i < stageIndex) s.status = 'done';
                            else if (i === stageIndex && i < this.stages.length) s.status = 'active';
                            else s.status = 'pending';
                        });

                        if (this.overallPercent >= 100) {
                            this.stages.forEach(s => s.status = 'done');
                            clearInterval(this._timer);
                            setTimeout(() => this.finishAnalysis(), 400);
                        }
                    }, 220);
                },

                finishAnalysis() {
                    this.clips = this.buildDemoClips();
                    this.view = 'results';
                },

                buildDemoClips() {
                    const raw = [
                        {
                            title: 'Why most people quit two weeks too early', start: '00:04:12', end: '00:04:52', score: 94, thumbColor: '#5DF838', duration: '0:40',
                            reason: 'Opens with a sharp contrarian hook, tells a complete story, and lands a punchy conclusion in under 40 seconds.',
                            metrics: [{ label: 'Hook strength', value: 97 }, { label: 'Curiosity', value: 92 }, { label: 'Standalone', value: 90 }, { label: 'Value', value: 88 }, { label: 'Entertainment', value: 85 }]
                        },
                        {
                            title: 'The $40 mistake that cost a client six figures', start: '00:11:30', end: '00:12:40', score: 89, thumbColor: '#D6B85F', duration: '1:10',
                            reason: 'Specific numbers and a clear cause-and-effect narrative make this segment highly shareable and self-contained.',
                            metrics: [{ label: 'Hook strength', value: 88 }, { label: 'Curiosity', value: 90 }, { label: 'Standalone', value: 85 }, { label: 'Value', value: 93 }, { label: 'Entertainment', value: 78 }]
                        },
                        {
                            title: 'How to read a room in the first ten seconds', start: '00:31:44', end: '00:32:35', score: 86, thumbColor: '#5DF838', duration: '0:51',
                            reason: 'Practical, numbered advice that stands alone perfectly and ends on a strong, quotable line.',
                            metrics: [{ label: 'Hook strength', value: 80 }, { label: 'Curiosity', value: 83 }, { label: 'Standalone', value: 92 }, { label: 'Value', value: 91 }, { label: 'Entertainment', value: 70 }]
                        },
                        {
                            title: 'A surprising stat about remote teams', start: '00:56:02', end: '00:56:58', score: 83, thumbColor: '#D6B85F', duration: '0:56',
                            reason: 'Leads with a counterintuitive statistic and resolves it cleanly — reliable formula for retention.',
                            metrics: [{ label: 'Hook strength', value: 90 }, { label: 'Curiosity', value: 88 }, { label: 'Standalone', value: 80 }, { label: 'Value', value: 82 }, { label: 'Entertainment', value: 68 }]
                        },
                        {
                            title: 'A blunt take on "hustle culture"', start: '00:22:05', end: '00:23:10', score: 81, thumbColor: '#D6705F', duration: '1:05',
                            reason: 'Controversial opinion delivered with conviction; strong for engagement though it references earlier context lightly.',
                            metrics: [{ label: 'Hook strength', value: 84 }, { label: 'Curiosity', value: 80 }, { label: 'Standalone', value: 70 }, { label: 'Value', value: 75 }, { label: 'Entertainment', value: 88 }]
                        },
                        {
                            title: 'The moment the interview goes off-script', start: '00:47:18', end: '00:48:22', score: 77, thumbColor: '#8A8FD6', duration: '1:04',
                            reason: 'Genuine emotional beat with strong pacing, though it benefits from brief framing text on export.',
                            metrics: [{ label: 'Hook strength', value: 74 }, { label: 'Curiosity', value: 78 }, { label: 'Standalone', value: 68 }, { label: 'Value', value: 72 }, { label: 'Entertainment', value: 90 }]
                        },
                    ];
                    return raw.map((c, i) => ({
                        id: i + 1,
                        ...c,
                    }));
                },

                diffTime(start, end) {
                    const s = this.toSeconds(start), e = this.toSeconds(end);
                    const d = e - s;
                    const m = Math.floor(d / 60), sec = d % 60;
                    return `${m}:${String(sec).padStart(2, '0')}`;
                },
                toSeconds(t) {
                    if (!t) return 0;
                    const p = t.split(':').map(Number);
                    return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
                },
                fmtTime(sec) {
                    sec = Math.max(0, Math.round(sec));
                    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
                    return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
                },

                filteredClips() {
                    let list = [...this.clips];
                    if (this.searchQuery.trim()) {
                        const q = this.searchQuery.toLowerCase();
                        list = list.filter(c => c.title.toLowerCase().includes(q) || c.reason.toLowerCase().includes(q));
                    }
                    const bySort = {
                        'AI Score': (a, b) => b.score - a.score,
                        'Duration': (a, b) => this.toSeconds(b.duration.includes(':') ? '0:' + b.duration : b.duration) - this.toSeconds('0:' + a.duration),
                        'Timestamp': (a, b) => this.toSeconds(a.start) - this.toSeconds(b.start),
                        'Relevance': (a, b) => b.metrics[3].value - a.metrics[3].value,
                    };
                    list.sort(bySort[this.sortBy] || bySort['AI Score']);
                    return list;
                },

                scoreColor(score) {
                    if (score >= 85) return '#5DF838';
                    if (score >= 70) return '#D6B85F';
                    return '#D6705F';
                },

                openClip(clip) {
                    this.selectedClip = clip;
                    this.editStart = clip.start;
                    this.editEnd = clip.end;
                    this.trimStartPct = 20;
                    this.trimEndPct = 80;
                },

                windowStart(clip) { return Math.max(0, this.toSeconds(clip.start) - 8); },
                windowEnd(clip) { return this.toSeconds(clip.end) + 8; },

                dragTrim(evt) {
                    if (!this.dragging2 || !this.$refs.track) return;
                    const rect = this.$refs.track.getBoundingClientRect();
                    let pct = ((evt.clientX - rect.left) / rect.width) * 100;
                    pct = Math.max(0, Math.min(100, pct));
                    if (this.dragging2 === 'start') {
                        this.trimStartPct = Math.min(pct, this.trimEndPct - 4);
                    } else {
                        this.trimEndPct = Math.max(pct, this.trimStartPct + 4);
                    }
                    const ws = this.windowStart(this.selectedClip), we = this.windowEnd(this.selectedClip);
                    const span = we - ws;
                    this.editStart = this.fmtTime(ws + (this.trimStartPct / 100) * span);
                    this.editEnd = this.fmtTime(ws + (this.trimEndPct / 100) * span);
                },

                commitTimestamps() {
                    if (this.selectedClip) {
                        this.selectedClip.start = this.editStart;
                        this.selectedClip.end = this.editEnd;
                        this.selectedClip.duration = this.diffTime(this.editStart, this.editEnd);
                    }
                },

                testConnection() {
                    this.testing = true;
                    setTimeout(() => {
                        this.testing = false;
                        this.apiConnected = true;
                        this.showToast('Gemini connection verified');
                    }, 900);
                },

                exportClip(clip) {
                    this.showToast(`Exporting "${clip.title}"…`);
                },

                showToast(msg) {
                    this.toast = msg;
                    clearTimeout(this._toastTimer);
                    this._toastTimer = setTimeout(() => this.toast = '', 2600);
                },
            }
        }
    </script>
